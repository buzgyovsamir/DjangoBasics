{% load static %}
{% load time_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ page_title }}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        header.navbar-custom { background-color: #2c3e50; padding: 0.75rem 1rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; max-width: 1200px; margin: 0 auto; }
        header.navbar-custom .brand { font-weight: 700; font-size: 1.25rem; color: rgba(255,255,255,.9); text-decoration: none; }
        header.navbar-custom .brand:hover { color: #fff; }
        header.navbar-custom nav { display: flex; gap: 0.5rem; align-items: center; }
        header.navbar-custom nav a { color: rgba(255,255,255,.9); text-decoration: none; padding: 0.5rem 1rem; border-radius: 0.375rem; }
        header.navbar-custom nav a:hover { background-color: rgba(255,255,255,.1); color: #fff; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <header class="navbar-custom">
        <img class="ms-4" height="50" width="50" src="{% static 'img.png' %}">

        <div>
            <a class="brand" href="{% url 'books:home' %}">Book Hub</a>
        </div>

        <nav>
            <a href="{% url 'books:list' %}">Books</a>
            <a href="{% url 'books:create' %}">Create Book</a>
            <a href="{% url 'reviews:recent' %}">Recent Reviews</a>
        </nav>

    </header>

    <main class="py-4">
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </main>
    <footer>
        {% time %}
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
