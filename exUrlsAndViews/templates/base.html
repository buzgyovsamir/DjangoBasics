<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ page_title|default:"Travel Application" }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-ink: #1a1a1a;
            --color-ink-muted: #5c5c5c;
            --color-cream: #faf7f2;
            --color-parchment: #f0ebe3;
            --color-sand: #e8e0d5;
            --color-terracotta: #c4724a;
            --color-terracotta-hover: #a85f3a;
            --color-forest: #2d4a3e;
            --color-forest-light: #3d5a4e;
            --color-gold: #c9a227;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', -apple-system, sans-serif;
            font-weight: 400;
            line-height: 1.7;
            color: var(--color-ink);
            background: var(--color-cream);
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px 48px;
        }

        header {
            background: linear-gradient(135deg, var(--color-forest) 0%, var(--color-forest-light) 100%);
            color: white;
            padding: 0;
            margin-bottom: 48px;
            box-shadow: var(--shadow-md);
        }

        nav {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 24px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        nav li {
            padding: 0;
            margin: 0;
            background: none;
            border: none;
        }

        nav a {
            display: block;
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        nav a:hover {
            background: rgba(255,255,255,0.15);
            color: white;
        }

        main {
            background: white;
            padding: 48px 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            min-height: 400px;
            border: 1px solid rgba(0,0,0,0.04);
        }

        h1 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 2.25rem;
            font-weight: 600;
            color: var(--color-ink);
            margin-bottom: 32px;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        h2 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--color-forest);
            margin-top: 40px;
            margin-bottom: 16px;
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            display: block;
            padding: 24px 28px;
            background: var(--color-parchment);
            border-radius: var(--radius-md);
            border: 1px solid var(--color-sand);
            text-decoration: none;
            color: inherit;
            transition: all 0.25s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--color-terracotta);
            background: white;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }

        .card-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--color-forest);
        }

        .card-subtitle {
            font-size: 0.9rem;
            color: var(--color-terracotta);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .card-excerpt {
            font-size: 0.9rem;
            color: var(--color-ink-muted);
            line-height: 1.6;
            margin-top: 12px;
        }

        article p, .card-excerpt {
            margin-bottom: 12px;
        }

        article p:last-of-type {
            margin-bottom: 0;
        }

        .meta {
            color: var(--color-ink-muted);
            font-size: 0.85rem;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--color-sand);
        }

        .actions {
            margin-top: 40px;
            padding-top: 28px;
            border-top: 1px solid var(--color-sand);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 12px 24px;
            background: var(--color-terracotta);
            color: white;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--color-terracotta-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--color-parchment);
            color: var(--color-ink);
            border: 1px solid var(--color-sand);
        }

        .btn-secondary:hover {
            background: var(--color-sand);
            border-color: var(--color-ink-muted);
        }

        .rating {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: linear-gradient(135deg, var(--color-gold) 0%, #d4af37 100%);
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 80px 40px;
        }

        .empty-state h1 {
            font-size: 1.75rem;
            color: var(--color-ink-muted);
            margin-bottom: 12px;
        }

        .empty-state p {
            color: var(--color-ink-muted);
            font-size: 1rem;
        }

        .destination-header {
            margin-bottom: 28px;
        }

        .destination-header .country {
            display: inline-block;
            font-size: 0.9rem;
            color: var(--color-terracotta);
            font-weight: 500;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .review-body {
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--color-ink);
        }

        .inline-link {
            color: var(--color-terracotta);
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .inline-link:hover {
            border-bottom-color: var(--color-terracotta);
        }

        .card-meta {
            font-size: 0.8rem;
            color: var(--color-ink-muted);
            margin-top: 10px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="{% url 'destination:index' %}">Home</a></li>
                <li><a href="{% url 'destination:list' %}">Destinations</a></li>
                <li><a href="{% url 'review:list' %}">Reviews</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

    {% block extra_js %}{% endblock %}
</body>
</html>
