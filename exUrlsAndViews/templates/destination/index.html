{% extends 'base.html' %}

{% block content %}
<div class="welcome-hero">
    <h1 class="welcome-title">Welcome to Our Travel Application</h1>
    <p class="welcome-lead">Discover destinations, read reviews, and plan your next adventure.</p>
    <div class="welcome-actions">
        <a href="{% url 'destination:list' %}" class="btn btn-primary-large">Browse Destinations</a>
        <a href="{% url 'review:list' %}" class="btn btn-secondary btn-large">See Reviews</a>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
    .welcome-hero {
        text-align: center;
        padding: 48px 24px 56px;
        max-width: 560px;
        margin: 0 auto;
    }

    .welcome-title {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 2.5rem;
        font-weight: 600;
        color: var(--color-forest);
        margin-bottom: 16px;
        letter-spacing: -0.02em;
        line-height: 1.2;
    }

    .welcome-lead {
        font-size: 1.1rem;
        color: var(--color-ink-muted);
        line-height: 1.7;
        margin-bottom: 36px;
    }

    .welcome-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
        align-items: center;
    }

    .btn-primary-large {
        display: inline-flex;
        align-items: center;
        padding: 16px 32px;
        background: linear-gradient(135deg, var(--color-terracotta) 0%, var(--color-terracotta-hover) 100%);
        color: white;
        border-radius: var(--radius-md);
        text-decoration: none;
        font-weight: 600;
        font-size: 1rem;
        transition: all 0.25s ease;
        box-shadow: var(--shadow-md);
    }

    .btn-primary-large:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(196, 114, 74, 0.35);
    }

    .btn-large {
        padding: 16px 32px;
        font-size: 1rem;
        font-weight: 600;
        border-radius: var(--radius-md);
    }
</style>
{% endblock %}
